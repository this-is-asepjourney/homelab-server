# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║             MASTER HOMELAB SERVER — UNIFIED DOCKER COMPOSE                   ║
# ║                                                                              ║
# ║  KONSEP: "1 CENTRAL CORE API GATEWAY, LOCAL DNS & ZERO REDUNDANCY"           ║
# ║  - Local DNS Engine (:53) -> Resolves *.homelab & *.fa.local                 ║
# ║  - Ingress Gateway Router (:80) -> Virtual Host Routing to All Projects      ║
# ║  - PAP Core API Gateway (:8000) -> Master API Core & PSM Control Plane       ║
# ║  - Menggunakan Grafana Utama yang sudah aktif       -> 192.168.25.101:3001   ║
# ║  - Menggunakan Prometheus Docker yang sudah aktif   -> 192.168.25.101:9001   ║
# ║  - Menggunakan Mosquitto MQTT yang sudah aktif      -> 192.168.25.101:1883   ║
# ║  - Menggunakan PostgreSQL Server yang sudah aktif   -> 192.168.25.101:5432   ║
# ║  - Menggunakan MySQL Server yang sudah aktif        -> 192.168.25.101:3306   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:

  # ═════════════════════════════════════════════════════════════════
  # 1. LOCAL DNS SERVER (CoreDNS — Custom Local Domain Engine :53)
  # Resolves *.homelab and *.fa.local to Homelab Server (LAN + Tailscale)
  # ═════════════════════════════════════════════════════════════════
  homelab-dns:
    image: coredns/coredns:latest
    container_name: homelab_dns
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    mem_limit: 64m
    cpus: 0.15
    ports:
      - "${HOST_IP:-192.168.25.101}:53:53/udp"
      - "${HOST_IP:-192.168.25.101}:53:53/tcp"
      - "${HOST_TAILSCALE:-100.106.63.90}:53:53/udp"
      - "${HOST_TAILSCALE:-100.106.63.90}:53:53/tcp"
      - "5353:53/udp"
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
      - ./dns/homelab.hosts:/etc/coredns/homelab.hosts:rw
    networks:
      - homelab-network

  # ═════════════════════════════════════════════════════════════════
  # 2. INGRESS GATEWAY ROUTER (Nginx Virtual Hosts :80)
  # Menerima traffic HTTP port 80 dan meneruskan ke kontainer tujuan
  # ═════════════════════════════════════════════════════════════════
  homelab-router:
    image: nginx:alpine
    container_name: homelab_router
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    ports:
      - "80:80"
    volumes:
      - ./router/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./router/conf.d:/etc/nginx/conf.d:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homelab-network
      - psm-network
    depends_on:
      pap-api:
        condition: service_healthy

  # ═════════════════════════════════════════════════════════════════
  # 3. PERSONAL API PLATFORM (PAP — Unified Central API Gateway & Core)
  # Mengintegrasikan PAP Core, PSM Control Plane, IoT Mapping, DNS, dan Backup Engine
  # ═════════════════════════════════════════════════════════════════
  pap-api:
    build:
      context: "./Personal Api Platform"
      dockerfile: docker/Dockerfile
    container_name: pap-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PAP_PORT:-8000}:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-psm}
      - POSTGRES_USER=${POSTGRES_USER:-appuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin12345}
      - POSTGRES_HOST=${POSTGRES_HOST:-192.168.25.101}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-admin12345}@${POSTGRES_HOST:-192.168.25.101}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-psm}}
      - PAP_DATABASE_URL=${PAP_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-admin12345}@${POSTGRES_HOST:-192.168.25.101}:${POSTGRES_PORT:-5432}/pap_core}
      - STOCK_DB_HOST=${STOCK_DB_HOST:-192.168.25.101}
      - STOCK_DB_PORT=${STOCK_DB_PORT:-3306}
      - STOCK_DB_NAME=${STOCK_DB_NAME:-appdb}
      - STOCK_DB_USER=${STOCK_DB_USER:-appuser}
      - STOCK_DB_PASSWORD=${STOCK_DB_PASSWORD:-admin12345}
      - MYSQL_HOST=${MYSQL_HOST:-192.168.25.101}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-adminroot12345}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-appdb}
      - MYSQL_USER=${MYSQL_USER:-appuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-admin12345}
      - STORAGE_BASE_DIR=/opt/psm
      - UPLOAD_DIR=/opt/psm/uploads
      - RELEASE_DIR=/opt/psm/releases
      - BACKUP_STORAGE_DIR=/app/backups
      - SECRET_KEY=${SECRET_KEY:-b8f36a89270df8417727e025170d1fa78f5f4d8520857ef51fa930f785b96a4e}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-dGhpcy1pcy1hLXNhbXBsZS1mZXJuZXQta2V5LTMyeS0=}
      - HOMELAB_AGENT_TOKEN=${HOMELAB_AGENT_TOKEN:-psm_agent_homelab_default_token}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://host.docker.internal:9001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - psm-storage:/opt/psm
      - homelab-backups:/app/backups
      - ./dns/homelab.hosts:/app/dns/homelab.hosts:rw
      - ./router/conf.d/projects:/app/router/conf.d/projects:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      homelab-network:
        aliases:
          - pap-api
          - api
          - core-api
          - psm-api
      psm-network:
        aliases:
          - pap-api
          - api
          - psm-api

  # ═════════════════════════════════════════════════════════════════
  # 4. PERSONAL SERVER MANAGER (PSM Frontend Web & Local Agent)
  # Terhubung langsung ke pap-api (:8000) sebagai Central Core Gateway
  # ═════════════════════════════════════════════════════════════════
  psm-web:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: psm-web
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    ports:
      - "${PSM_WEB_PORT:-3005}:3005"
    environment:
      - INTERNAL_API_URL=http://pap-api:8000
      - NEXT_PUBLIC_API_URL=http://${HOST_IP:-192.168.25.101}:${PAP_PORT:-8000}
      - NEXT_PUBLIC_WS_URL=ws://${HOST_IP:-192.168.25.101}:${PAP_PORT:-8000}
    depends_on:
      pap-api:
        condition: service_healthy
    networks:
      - homelab-network
      - psm-network

  psm-agent:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.agent
    container_name: psm-agent
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    env_file:
      - .env
    environment:
      - SERVER_ID=homelab-primary
      - AGENT_TOKEN=${HOMELAB_AGENT_TOKEN:-psm_agent_homelab_default_token}
      - CONTROL_PLANE_URL=http://pap-api:8000
      - PSM_BASE_DIR=/opt/psm
      - POSTGRES_DB=${POSTGRES_DB:-psm}
      - POSTGRES_USER=${POSTGRES_USER:-appuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin12345}
      - POSTGRES_HOST=${POSTGRES_HOST:-192.168.25.101}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - HOMELAB_HOST_IP=${HOST_IP:-192.168.25.101}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - psm-storage:/opt/psm
    depends_on:
      pap-api:
        condition: service_healthy
    networks:
      - homelab-network
      - psm-network

  # ═════════════════════════════════════════════════════════════════
  # 5. IOT DASHBOARD (HEATPRESS FLEET MONITORING)
  # Menggunakan PAP Core API Gateway (:8000) untuk Device Mapping & Telemetry
  # ═════════════════════════════════════════════════════════════════
  iot-telegraf:
    image: telegraf:1.29
    container_name: iot_telegraf
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "${IOT_TELEGRAF_PORT:-9273}:9273"
    volumes:
      - ./dashboard_iot/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-192.168.25.101}
      - MQTT_TAILSCALE_HOST=${MQTT_TAILSCALE_HOST:-100.106.63.90}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-useriot}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-25022002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homelab-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9273/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  iot-web:
    image: nginx:alpine
    container_name: iot_dashboard_web
    restart: always
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "${IOT_WEB_PORT:-8088}:80"
    volumes:
      - ./dashboard_iot/web:/usr/share/nginx/html:ro
      - ./dashboard_iot/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homelab-network
    depends_on:
      pap-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

# ─────────────────────────────────────────────────────────────────────────────
# PERSISTENT VOLUMES
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  psm-storage:
  homelab-backups:

# ─────────────────────────────────────────────────────────────────────────────
# INTERNAL NETWORKS
# ─────────────────────────────────────────────────────────────────────────────
networks:
  homelab-network:
    name: homelab-network
    driver: bridge
  psm-network:
    name: psm-network
    driver: bridge
