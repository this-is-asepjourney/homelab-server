# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║             MASTER HOMELAB SERVER — UNIFIED DOCKER COMPOSE                   ║
# ║                                                                              ║
# ║  KONSEP: "MENGGUNAKAN LAYANAN YANG SUDAH TERINSTALL DI SERVER"               ║
# ║  - Menggunakan Grafana Utama yang sudah aktif       -> 192.168.25.101:3001   ║
# ║  - Menggunakan Prometheus Snap yang sudah aktif     -> 192.168.25.101:9001   ║
# ║  - Menggunakan Mosquitto MQTT yang sudah aktif      -> 192.168.25.101:1883   ║
# ║  - Menggunakan PostgreSQL Server yang sudah aktif   -> 192.168.25.101:5432   ║
# ║  - Menggunakan MySQL Server yang sudah aktif        -> 192.168.25.101:3306   ║
# ║                                                                              ║
# ║  Hanya menjalankan 6 container aplikasi inti dari 3 proyek:                  ║
# ║  1. Personal API Platform   : pap-api               (:8000)                  ║
# ║  2. Personal Server Manager : psm-api               (:8001)                  ║
# ║                               psm-web               (:3005)                  ║
# ║                               psm-agent             (Host Agent)             ║
# ║  3. IoT Dashboard           : iot-telegraf          (:9273)                  ║
# ║                               iot-api               (:8002)                  ║
# ║                               iot-web               (:8088)                  ║
# ║                                                                              ║
# ║  * TIDAK ADA container duplikat untuk Database, Prometheus, atau Grafana!    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:

  # ═════════════════════════════════════════════════════════════════
  # 1. PERSONAL API PLATFORM (PAP — Core API Gateway)
  # ═════════════════════════════════════════════════════════════════
  pap-api:
    build:
      context: "./Personal Api Platform"
      dockerfile: docker/Dockerfile
    container_name: pap-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_IP:-192.168.25.101}:${PAP_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - homelab-network

  # ═════════════════════════════════════════════════════════════════
  # 2. PERSONAL SERVER MANAGER (PSM — Control Plane & Management)
  # ═════════════════════════════════════════════════════════════════
  psm-api:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: psm-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PSM_API_PORT:-8001}:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-psm}
      - POSTGRES_USER=${POSTGRES_USER:-appuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin12345}
      - POSTGRES_HOST=${POSTGRES_HOST:-192.168.25.101}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-admin12345}@${POSTGRES_HOST:-192.168.25.101}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-psm}}
      - STORAGE_BASE_DIR=/opt/psm
      - UPLOAD_DIR=/opt/psm/uploads
      - RELEASE_DIR=/opt/psm/releases
      - SECRET_KEY=${SECRET_KEY:-b8f36a89270df8417727e025170d1fa78f5f4d8520857ef51fa930f785b96a4e}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-dGhpcy1pcy1hLXNhbXBsZS1mZXJuZXQta2V5LTMyeS0=}
      - HOMELAB_AGENT_TOKEN=${HOMELAB_AGENT_TOKEN:-psm_agent_homelab_default_token}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://host.docker.internal:9001}
      - PAP_API_URL=${PAP_API_URL:-http://192.168.25.101:8000}
      - PAP_API_KEY=${PAP_API_KEY:-pap_key_psm_control_plane_default_secret_key_2026}
      - IOT_DASHBOARD_URL=${IOT_DASHBOARD_URL:-http://192.168.25.101:8088}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - psm-storage:/opt/psm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      homelab-network:
      psm-network:
        aliases:
          - api
          - psm-api

  psm-web:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: psm-web
    restart: unless-stopped
    ports:
      - "${PSM_WEB_PORT:-3005}:3005"
    environment:
      - INTERNAL_API_URL=http://psm-api:8000
      - NEXT_PUBLIC_API_URL=http://${HOST_IP:-192.168.25.101}:${PSM_API_PORT:-8001}
      - NEXT_PUBLIC_WS_URL=ws://${HOST_IP:-192.168.25.101}:${PSM_API_PORT:-8001}
    depends_on:
      psm-api:
        condition: service_healthy
    networks:
      - psm-network

  psm-agent:
    build:
      context: ./Personal_Server_Manager
      dockerfile: infrastructure/docker/Dockerfile.agent
    container_name: psm-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVER_ID=homelab-primary
      - AGENT_TOKEN=${HOMELAB_AGENT_TOKEN:-psm_agent_homelab_default_token}
      - CONTROL_PLANE_URL=http://psm-api:8000
      - PSM_BASE_DIR=/opt/psm
      - POSTGRES_DB=${POSTGRES_DB:-psm}
      - POSTGRES_USER=${POSTGRES_USER:-appuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin12345}
      - POSTGRES_HOST=${POSTGRES_HOST:-192.168.25.101}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - psm-storage:/opt/psm
    depends_on:
      psm-api:
        condition: service_healthy
    networks:
      - psm-network

  # ═════════════════════════════════════════════════════════════════
  # 3. IOT DASHBOARD (HEATPRESS FLEET MONITORING)
  # ═════════════════════════════════════════════════════════════════
  iot-telegraf:
    image: telegraf:1.29
    container_name: iot_telegraf
    restart: unless-stopped
    ports:
      - "${IOT_TELEGRAF_PORT:-9273}:9273"
    volumes:
      - ./dashboard_iot/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-192.168.25.101}
      - MQTT_TAILSCALE_HOST=${MQTT_TAILSCALE_HOST:-100.106.63.90}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-useriot}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-25022002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iot-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9273/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  iot-api:
    build:
      context: ./dashboard_iot/api
    container_name: iot_device_mapping_api
    restart: always
    ports:
      - "${IOT_API_PORT:-8002}:8000"
    volumes:
      - ./dashboard_iot/api/data:/app/data
      - ./dashboard_iot/api:/app/api
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://host.docker.internal:9001}
      - ONLINE_THRESHOLD_MINUTES=${ONLINE_THRESHOLD_MINUTES:-5}
      - PAP_API_URL=${PAP_API_URL:-http://192.168.25.101:8000}
      - PAP_API_KEY=${PAP_API_KEY:-pap_key_iot_dashboard_default_secret_key_2026}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-192.168.25.101}
      - MQTT_TAILSCALE_HOST=${MQTT_TAILSCALE_HOST:-100.106.63.90}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-useriot}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-25022002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      homelab-network:
      iot-network:
        aliases:
          - api
          - iot-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  iot-web:
    image: nginx:alpine
    container_name: iot_dashboard_web
    restart: always
    ports:
      - "${IOT_WEB_PORT:-8088}:80"
    volumes:
      - ./dashboard_iot/web:/usr/share/nginx/html:ro
      - ./dashboard_iot/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iot-network
    depends_on:
      iot-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

# ─────────────────────────────────────────────────────────────────────────────
# PERSISTENT VOLUMES (Hanya untuk storage PSM, tidak ada volume DB duplikat)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  psm-storage:

# ─────────────────────────────────────────────────────────────────────────────
# INTERNAL NETWORKS
# ─────────────────────────────────────────────────────────────────────────────
networks:
  homelab-network:
    name: homelab-network
    driver: bridge
  psm-network:
    name: psm-network
    driver: bridge
  iot-network:
    name: iot-network
    driver: bridge

