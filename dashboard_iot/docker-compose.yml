# ╔══════════════════════════════════════════════════════════════╗
# ║         IoT Dashboard - Docker Compose Configuration         ║
# ║                                                              ║
# ║  Arsitektur Homelab (Menggunakan Layanan Eksisting):         ║
# ║  [ESP32] ──MQTT──> [Mosquitto Broker eksisting :1883]        ║
# ║       └──> [iot_telegraf :9273]                              ║
# ║       └──> [Prometheus eksisting :9001] (Scrape :9273)       ║
# ║       └──> [Grafana eksisting :3001] (Visualisasi)           ║
# ║                                                              ║
# ║  Stack Container Aktif (Hanya komponen unik IoT):           ║
# ║  1. [iot_telegraf]             MQTT Bridge Exporter (:9273)  ║
# ║  2. [iot_device_mapping_api]   Device Registry (:8002)       ║
# ║  3. [iot_dashboard_web]        Nginx Web Hub (:8088)         ║
# ║                                                              ║
# ║  * Container Grafana & Prometheus kedua TIDAK dibuat         ║
# ║    untuk mencegah bentrok port dan duplikasi resource.       ║
# ╚══════════════════════════════════════════════════════════════╝

services:

  # ─────────────────────────────────────────────
  # MQTT BRIDGE (Telegraf)
  # Subscribe ke MQTT broker Mosquitto eksisting (:1883),
  # parse JSON payload dari mesin, lalu ekspos metrik di :9273
  # untuk di-scrape oleh Prometheus eksisting server (:9001).
  # ─────────────────────────────────────────────
  telegraf:
    image: telegraf:1.29
    container_name: iot_telegraf
    restart: unless-stopped
    ports:
      - "${IOT_TELEGRAF_PORT:-9273}:9273"
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-192.168.25.101}
      - MQTT_TAILSCALE_HOST=${MQTT_TAILSCALE_HOST:-100.106.63.90}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-useriot}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-25022002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9273/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # DEVICE MANAGEMENT API (FastAPI)
  # Menyimpan: MAC Address ↔ MCID, Model, Lokasi (SQLite)
  # Mengambil status Online/Offline langsung dari Prometheus eksisting (:9001)
  # ─────────────────────────────────────────────
  api:
    build: ./api
    container_name: iot_device_mapping_api
    restart: always
    ports:
      - "${IOT_API_PORT:-8002}:8000"
    volumes:
      - ./api/data:/app/data
      - ./api:/app/api
    environment:
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://host.docker.internal:9001}
      - ONLINE_THRESHOLD_MINUTES=${ONLINE_THRESHOLD_MINUTES:-5}
      - PAP_API_URL=${PAP_API_URL:-http://192.168.25.101:8000}
      - PAP_API_KEY=${PAP_API_KEY:-pap_key_iot_dashboard_default_secret_key_2026}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-192.168.25.101}
      - MQTT_TAILSCALE_HOST=${MQTT_TAILSCALE_HOST:-100.106.63.90}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-useriot}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-25022002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # WEB DASHBOARD (Nginx Web Hub)
  # Menyajikan antarmuka web di port :8088:
  #   /         → Web UI Heatpress Fleet
  #   /api/     → iot_device_mapping_api:8000
  #   /grafana/ → Reverse proxy ke Grafana eksisting (:3001)
  # ─────────────────────────────────────────────
  web:
    image: nginx:alpine
    container_name: iot_dashboard_web
    restart: always
    ports:
      - "${IOT_WEB_PORT:-8088}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iot_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ═════════════════════════════════════════════
  # LAYANAN OPSIONAL / DEBUG ISOLASI MANDIRI
  # Diatur dengan profile "debug-standalone" sehingga TIDAK
  # akan dijalankan saat 'docker compose up -d' standar.
  # (Mencegah container ganda dan bentrok port dengan layanan eksisting)
  # ═════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: iot_prometheus_standalone
    profiles:
      - debug-standalone
    ports:
      - "${IOT_PROMETHEUS_PORT:-9095}:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    networks:
      - iot_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: iot_grafana_standalone
    profiles:
      - debug-standalone
    ports:
      - "${IOT_GRAFANA_PORT:-3003}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-adminpassword}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - iot_network

networks:
  iot_network:
    driver: bridge
