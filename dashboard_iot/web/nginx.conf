server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # ─────────────────────────────────────────────
    # Serve static files for the IoT Web Dashboard
    # ─────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ─────────────────────────────────────────────
    # Reverse Proxy: Personal API Platform (PAP Core API Gateway)
    # Accessible at: http://localhost/api/
    # Also proxy health + docs endpoints
    # Internally routes directly to: http://pap-api:8000/
    # ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://pap-api:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }

    # Health endpoint
    location = /api/health {
        proxy_pass         http://pap-api:8000/api/health;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # FastAPI docs (swagger)
    location = /api/docs {
        proxy_pass         http://pap-api:8000/docs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/openapi.json {
        proxy_pass         http://pap-api:8000/openapi.json;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────────────
    # Reverse Proxy: Grafana Dashboard Eksisting (Port 3001)
    # Mengarah ke Grafana yang sudah terinstall di Homelab Server
    # ─────────────────────────────────────────────
    location /grafana/ {
        proxy_pass         http://host.docker.internal:3001/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Required for Grafana websockets (live data, alerting)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
