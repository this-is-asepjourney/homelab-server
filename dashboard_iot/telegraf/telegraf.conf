[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = true
  # Log level: "error" | "warn" | "info" | "debug"
  logfile = ""
  logtarget = "stderr"

# ──────────────────────────────────────────────────────
# OUTPUT: Prometheus Client (scrape endpoint di :9273)
# ──────────────────────────────────────────────────────
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  string_as_label = false
  # Expiration: metric dihapus dari endpoint jika tidak ada update selama 1 menit (dipercepat agar status UI lebih responsif)
  expiration_interval = "1m"

# ──────────────────────────────────────────────────────
# PROCESSOR: Standardize MAC Address & Model Tags
# ──────────────────────────────────────────────────────
[[processors.rename]]
  [[processors.rename.replace]]
    tag = "IOT_MAC"
    dest = "MAC"
  [[processors.rename.replace]]
    tag = "mac"
    dest = "MAC"
  [[processors.rename.replace]]
    tag = "IOT_MODEL"
    dest = "model"

# ──────────────────────────────────────────────────────
# PROCESSOR: Konversi STS (ON/OFF) → angka untuk Prometheus
# ──────────────────────────────────────────────────────
[[processors.enum]]
  [[processors.enum.mapping]]
    field = "STS"
    [processors.enum.mapping.value_mappings]
      ON = 1
      OFF = 0

# ──────────────────────────────────────────────────────
# INPUT: MQTT — SysCtrl (status mesin, versi, IP)
# Topic: {DeviceID}/SysCtrl
# Tags: MAC, IOT_MAC, MCID, model — identifier utama device
# ──────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER_HOST}:${MQTT_BROKER_PORT}"]
  topics = ["+/SysCtrl"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  name_override = "sysctrl"
  # Reconnect otomatis jika broker tidak tersedia
  connection_timeout = "30s"
  # json_string_fields: field string yang disimpan sebagai label (bukan angka)
  json_string_fields = [
    "MAC", "IOT_MAC", "MCID", "IOT_MODEL", "AP_MAC",
    "IOT_SPPL_CD", "MCIP", "STS", "VER",
    "mac", "model", "mcid", "sts", "ver"
  ]
  # tag_keys: Menyertakan IOT_MAC, mac, model, IOT_MODEL agar menjadi label Prometheus
  tag_keys = ["MAC", "IOT_MAC", "MCID", "mac", "mcid", "model", "IOT_MODEL"]

# ──────────────────────────────────────────────────────
# INPUT: MQTT — Event Count (hitungan proses)
# Topic: {DeviceID}/Event/Cnt
# ──────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER_HOST}:${MQTT_BROKER_PORT}"]
  topics = ["+/Event/Cnt"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  name_override = "event_cnt"
  connection_timeout = "30s"
  json_string_fields = ["MAC", "IOT_MAC", "MCID", "PROCESSID", "TYPE", "UID", "mac", "process_id", "model", "IOT_MODEL"]
  tag_keys = ["MAC", "IOT_MAC", "MCID", "mac", "process_id", "model", "IOT_MODEL"]

# ──────────────────────────────────────────────────────
# INPUT: MQTT — Event Handling (proses handling)
# Topic: {DeviceID}/Event/Handling
# ──────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER_HOST}:${MQTT_BROKER_PORT}"]
  topics = ["+/Event/Handling"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  name_override = "event_handling"
  connection_timeout = "30s"
  json_string_fields = ["MAC", "IOT_MAC", "MCID", "PROCESS_ID", "mac", "process_id", "model", "IOT_MODEL"]
  tag_keys = ["MAC", "IOT_MAC", "MCID", "mac", "process_id", "model", "IOT_MODEL"]

# ──────────────────────────────────────────────────────
# INPUT: MQTT — Machine Time (waktu operasional mesin)
# Topic: {DeviceID}/Event/Mchn_time
# ──────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER_HOST}:${MQTT_BROKER_PORT}"]
  topics = ["+/Event/Mchn_time"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  name_override = "machine_time"
  connection_timeout = "30s"
  json_string_fields = ["MAC", "IOT_MAC", "MCID", "mac", "model", "IOT_MODEL"]
  tag_keys = ["MAC", "IOT_MAC", "MCID", "mac", "model", "IOT_MODEL"]

# ──────────────────────────────────────────────────────
# INPUT: MQTT — Heatpress (data tekanan/suhu heat press)
# Topic: {DeviceID}/Heatpress
# ──────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER_HOST}:${MQTT_BROKER_PORT}"]
  topics = ["+/Heatpress"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  data_format = "json"
  name_override = "heatpress"
  connection_timeout = "30s"
  json_string_fields = ["MAC", "IOT_MAC", "MCID", "mac", "model", "IOT_MODEL"]
  tag_keys = ["MAC", "IOT_MAC", "MCID", "mac", "model", "IOT_MODEL"]