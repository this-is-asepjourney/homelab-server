apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: MySQL - eternal_db
    uid: mysql-iot-db
    type: mysql
    access: proxy
    url: 192.168.25.101:3306
    user: appuser
    database: eternal_db
    isDefault: false
    jsonData:
      database: eternal_db
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      timezone: Asia/Jakarta
    secureJsonData:
      password: admin12345

  - name: InfluxDB - eternal_telemetry
    uid: influxdb-iot
    type: influxdb
    access: proxy
    url: http://192.168.25.101:8086
    isDefault: false
    jsonData:
      version: Flux
      organization: homelab
      defaultBucket: eternal_telemetry
      tlsSkipVerify: true
    secureJsonData:
      token: homelab-influxdb-master-auth-token-2026
