apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: PostgreSQL - eternal_iot
    uid: postgres-iot-db
    type: postgres
    access: proxy
    url: 192.168.25.101:5432
    user: appuser
    database: eternal_iot
    isDefault: false
    jsonData:
      database: eternal_iot
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    secureJsonData:
      password: admin12345

  - name: MySQL - eternal_db
    uid: mysql-iot-db
    type: mysql
    access: proxy
    url: 192.168.25.101:3306
    user: appuser
    database: eternal_db
    isDefault: false
    jsonData:
      database: eternal_db
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      timezone: Asia/Jakarta
    secureJsonData:
      password: admin12345

